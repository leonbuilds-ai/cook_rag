services:
  postgres:
    image: postgres:15-alpine
    container_name: cook-rag-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-cookrag}"
      POSTGRES_DB: "${POSTGRES_DB:-cookrag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s
volumes:
  postgres-data:
    name: cook-rag-postgres-data
